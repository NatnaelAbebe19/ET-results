<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET Results - Candidate List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-bg"></div>
    
    <main class="container">
        <header class="header animate-in">
            <div class="logo">
                <span class="logo-icon">✈️</span>
                <h1>Candidates <span class="accent">List</span></h1>
            </div>
            <a href="https://corporate.ethiopianairlines.com/AboutEthiopian/careers/results" target="_blank" class="visit-website-btn">
                <span>Visit Website</span>
                <span class="icon">↗️</span>
            </a>
        </header>

        <section class="candidates-section animate-in delay-1">
            <div class="section-header">
                <h3>Qualified Candidates</h3>
                <span class="count-badge" id="candidate-count">0</span>
            </div>
            
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="candidate-search" placeholder="Search for your name...">
            </div>

            <div class="candidates-table-container">
                <table class="candidates-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Full Name</th>
                        </tr>
                    </thead>
                    <tbody id="candidates-list">
                        <!-- Candidates will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer animate-in delay-2">
            <p>© 2026 Ethiopian Airlines Group. All rights reserved.</p>
            <p class="disclaimer">Please arrive on time with proper business attire.</p>
        </footer>
    </main>

    <script>
        const resultId = window.location.pathname.split('/').pop();
        const candidatesList = document.getElementById('candidates-list');
        const searchInput = document.getElementById('candidate-search');
        let allCandidates = [];

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function loadData() {
            try {
                const response = await fetch(`/api/results/${resultId}`);
                if (!response.ok) throw new Error('Result not found');
                const data = await response.json();

                const posName = data.position || 'Announcement';
                document.title = `${posName} - Candidates`;
                const count = data.candidates ? data.candidates.length : 0;
                document.getElementById('candidate-count').textContent = count;

                allCandidates = data.candidates || [];
                renderCandidates(allCandidates);

                if (data.archived && allCandidates.length === 0) {
                    candidatesList.innerHTML = '<tr><td colspan="2" class="no-results">📌 Archived announcement. Detailed candidate list is no longer hosted on the corporate portal.</td></tr>';
                }
            } catch (err) {
                document.body.innerHTML = `<div class="error-msg"><h1>404</h1><p>Announcement Not Found</p><a href="/">Return Home</a></div>`;
            }
        }

        function renderCandidates(candidates) {
            if (!candidates || candidates.length === 0) {
                candidatesList.innerHTML = '<tr><td colspan="2" class="no-results">No candidates found</td></tr>';
                return;
            }
            // Batch render to avoid DOM reflows
            candidatesList.innerHTML = candidates.map(c => `
                <tr>
                    <td class="col-no">${escapeHtml(c.no)}</td>
                    <td class="col-name">${escapeHtml(c.name)}</td>
                </tr>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allCandidates.filter(c => c.name.toLowerCase().includes(term));
            renderCandidates(filtered);
        });

        loadData();
    </script>
</body>
</html>
